<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="barGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#82b1ff"/>
    </linearGradient>
  </defs>

  <!-- Bars -->
  <rect x="20" y="40" width="8" height="40" rx="2" fill="url(#barGrad1)"/>
  <rect x="34" y="28" width="8" height="52" rx="2" fill="url(#barGrad2)"/>
  <rect x="48" y="18" width="8" height="62" rx="2" fill="url(#barGrad1)"/>
  <rect x="62" y="30" width="8" height="50" rx="2" fill="url(#barGrad2)"/>
  <rect x="76" y="10" width="8" height="70" rx="2" fill="url(#barGrad1)"/>

  <!-- Trend line overlay -->
  <polyline points="24,40 38,28 52,18 66,30 80,10"
            fill="none" stroke="#4a4a4e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow on trend line -->
  <polygon points="76,9 80,16 85,5" fill="#4a4a4e"/>

  <text x="95" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#4a4a4e">InvestDayTip</text>
  <text x="95" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#888" letter-spacing="1.5">MULTI-FACTOR INVESTING TOOL</text>
</svg>
