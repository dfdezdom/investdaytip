<svg xmlns="http://w3.org" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Degradado tecnológico verde/azul para el éxito financiero -->
    <linearGradient id="investGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00E575" />
    </linearGradient>
  </defs>

  <!-- ICONO: Vela Japonesa (Inversión) + Bombilla/Idea (Tip) -->
  <g transform="translate(20, 15)">
    <!-- Línea superior de la vela (mecha) -->
    <line x1="60" y1="10" x2="60" y2="35" stroke="#00E575" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Cuerpo de la vela (forma estilizada de foco/brote) -->
    <path d="M45,35 H75 V85 C75,95 68,105 60,105 C52,105 45,95 45,85 Z" fill="url(#investGrad)" />
    
    <!-- Línea inferior de la vela -->
    <line x1="60" y1="105" x2="60" y2="120" stroke="#00B4D8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Detalle de destello/idea -->
    <circle cx="60" cy="60" r="6" fill="#0D1117" />
  </g>

  <!-- TEXTO: Nombre del repositorio -->
  <g transform="translate(140, 85)">
    <!-- "invest" en estilo fino/moderno -->
    <text font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="42" font-weight="300" fill="#FFFFFF" letter-spacing="1">invest</text>
    
    <!-- "day" en negrita para resaltar el concepto diario -->
    <text x="112" y="0" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="42" font-weight="800" fill="#00E575" letter-spacing="1">day</text>
    
    <!-- "tip" en el tono azul del degradado -->
    <text x="188" y="0" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="42" font-weight="400" fill="#00B4D8" letter-spacing="1">tip</text>
    
    <!-- Subtítulo del proyecto -->
    <text x="2" y="30" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="14" font-weight="400" fill="#8B949E" letter-spacing="4">FINANCIAL INSIGHTS</text>
  </g>
</svg>
